name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build tests/CodexAutoYes.Tests.csproj -c Release
      - name: Run isolated checks
        run: |
          & .\tests\bin\Release\net10.0-windows\CodexAutoYes.Tests.exe --ci
          exit $LASTEXITCODE
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: artifacts/test-results.txt
      - name: Publish self-contained Windows app
        run: >-
          dotnet publish CodexAutoYes.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false
          -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Package and checksum
        run: |
          if (!(Test-Path -LiteralPath artifacts/publish/CodexAutoYes.exe)) {
            throw 'Published executable is missing.'
          }
          Copy-Item -LiteralPath README.md -Destination artifacts/publish/README.md
          New-Item -ItemType Directory -Path artifacts/release | Out-Null
          $archive = 'artifacts/release/AgentAutoReply-win-x64.zip'
          Compress-Archive -Path artifacts/publish/* -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AgentAutoReply-win-x64.zip" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: artifacts/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
